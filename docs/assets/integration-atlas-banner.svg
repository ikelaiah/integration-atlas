<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title description">
  <title id="title">Integration Atlas</title>
  <desc id="description">A map of Windows and Linux scheduler jobs flowing through scripts to databases, files and APIs, beside the Integration Atlas name.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101f"/><stop offset="0.55" stop-color="#0a1630"/><stop offset="1" stop-color="#17132f"/>
    </linearGradient>
    <linearGradient id="atlas-mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#71d8ff"/><stop offset="1" stop-color="#4c8dff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#52c8ff"/><stop offset="1" stop-color="#55e0bb"/></linearGradient>
    <radialGradient id="blue-halo"><stop offset="0" stop-color="#1c73c7" stop-opacity=".22"/><stop offset="1" stop-color="#1c73c7" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet-halo"><stop offset="0" stop-color="#7448a7" stop-opacity=".17"/><stop offset="1" stop-color="#7448a7" stop-opacity="0"/></radialGradient>
    <pattern id="dot-grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#87b7e8" opacity=".18"/></pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1800" height="600" rx="30" fill="url(#background)"/><rect width="1800" height="600" rx="30" fill="url(#dot-grid)"/>
  <ellipse cx="1310" cy="280" rx="610" ry="430" fill="url(#blue-halo)"/><ellipse cx="1690" cy="135" rx="340" ry="280" fill="url(#violet-halo)"/>

  <!-- Compass mark built from connected system nodes. -->
  <g transform="translate(102 111)">
    <circle cx="42" cy="42" r="39" fill="#0e2543" stroke="#28547c" stroke-width="2"/>
    <path d="M23 56 35 34 62 25 51 51 23 56Z" fill="none" stroke="url(#atlas-mark)" stroke-width="3" stroke-linejoin="round"/><path d="m35 34 16 17" stroke="#78e5db" stroke-width="2" opacity=".9"/>
    <circle cx="23" cy="56" r="4" fill="#63d6ff"/><circle cx="35" cy="34" r="4" fill="#68e2d2"/><circle cx="62" cy="25" r="4" fill="#80a9ff"/><circle cx="51" cy="51" r="4" fill="#63d6ff"/>
  </g>
  <text x="202" y="148" fill="#d7e6f5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" letter-spacing="3.5">MAP THE SYSTEMS YOU INHERITED</text>
  <text x="100" y="264" fill="#f5f8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="720" letter-spacing="-2.4">Integration</text>
  <text x="100" y="352" fill="url(#accent)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="720" letter-spacing="-2.4">Atlas</text>
  <text x="103" y="414" fill="#bdcadd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Trace the jobs, scripts and systems.</text>
  <text x="103" y="449" fill="#bdcadd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">See what could break when something changes.</text>
  <g transform="translate(103 500)">
    <rect width="12" height="12" rx="3" y="1" fill="#55d4c0"/><text x="24" y="13" fill="#a9bed3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="1.4">LOCAL-FIRST</text>
    <rect x="160" y="1" width="12" height="12" rx="3" fill="#55d4c0"/><text x="184" y="13" fill="#a9bed3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="1.4">EVIDENCE-LED</text>
    <rect x="355" y="1" width="12" height="12" rx="3" fill="#55d4c0"/><text x="379" y="13" fill="#a9bed3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="1.4">IMPACT ANALYSIS</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="800" y="83" fill="#8ea8c2" font-size="14" font-weight="700" letter-spacing="2.6">FROM SCHEDULE TO IMPACT</text>

    <!-- Edges sit behind the nodes. The file link is shared by both server flows. -->
    <g fill="none" stroke="#5d91c5" stroke-width="2.4" opacity=".78">
      <path d="M1002 164H1045M1200 164H1240M1002 424H1045M1200 424H1240"/>
    </g>
    <path d="M1510 161C1480 161 1475 164 1445 164" fill="none" stroke="#69bdb9" stroke-width="2.4" opacity=".78"/>
    <path d="M1445 190C1478 208 1477 255 1510 278M1510 286C1472 286 1479 424 1445 424M1445 414C1474 407 1479 405 1510 405M1445 434C1478 448 1479 500 1510 500" fill="none" stroke="#69bdb9" stroke-width="2.4" opacity=".78"/>

    <!-- Two execution servers and their scheduled jobs. -->
    <rect x="800" y="125" width="202" height="78" rx="11" fill="#0c1b31" stroke="#35628b" stroke-width="1.5"/>
    <rect x="815" y="145" width="34" height="34" rx="8" fill="#102f4f"/>
    <path d="M823 154h18v16h-18zM827 150v7M837 150v7M823 160h18" fill="none" stroke="#71ceff" stroke-width="1.7" stroke-linecap="round"/>
    <text x="861" y="157" fill="#e5f0fa" font-size="15" font-weight="650">Task Scheduler</text>
    <text x="861" y="178" fill="#8fa8c1" font-size="13">APP-SERVER-01</text>

    <rect x="1045" y="125" width="155" height="78" rx="11" fill="#12233c" stroke="#4671a0" stroke-width="1.5"/>
    <circle cx="1065" cy="151" r="7" fill="#4a9cff"/>
    <text x="1080" y="156" fill="#eaf3ff" font-size="14" font-weight="650">Nightly export</text>
    <text x="1060" y="181" fill="#93abc4" font-size="12">scheduled job</text>

    <rect x="800" y="385" width="202" height="78" rx="11" fill="#0c1b31" stroke="#35628b" stroke-width="1.5"/>
    <rect x="815" y="405" width="34" height="34" rx="8" fill="#12352f"/>
    <path d="M823 411h18v22h-18zM826 416h12M826 421h12M826 426h8" fill="none" stroke="#70dfbd" stroke-width="1.7" stroke-linecap="round"/>
    <text x="861" y="417" fill="#e5f0fa" font-size="15" font-weight="650">Linux cron</text>
    <text x="861" y="438" fill="#8fa8c1" font-size="13">APP-SERVER-02</text>

    <rect x="1045" y="385" width="155" height="78" rx="11" fill="#12233c" stroke="#4671a0" stroke-width="1.5"/>
    <circle cx="1065" cy="411" r="7" fill="#58d4b5"/>
    <text x="1080" y="416" fill="#eaf3ff" font-size="14" font-weight="650">Identity sync</text>
    <text x="1060" y="441" fill="#93abc4" font-size="12">scheduled job</text>

    <!-- Local scripts discovered from the jobs. -->
    <rect x="1240" y="125" width="205" height="78" rx="11" fill="#13253c" stroke="#4a8297" stroke-width="1.5"/>
    <path d="m1257 150-8 7 8 7M1278 150l8 7-8 7M1273 146l-9 22" fill="none" stroke="#70d9cb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1294" y="157" fill="#e5f0fa" font-size="14" font-weight="650">export_students.ps1</text>
    <text x="1294" y="178" fill="#8fa8c1" font-size="12">PowerShell script</text>

    <rect x="1240" y="385" width="205" height="78" rx="11" fill="#13253c" stroke="#4a8297" stroke-width="1.5"/>
    <path d="m1257 410-8 7 8 7M1278 410l8 7-8 7M1273 406l-9 22" fill="none" stroke="#70d9cb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1294" y="417" fill="#e5f0fa" font-size="14" font-weight="650">identity_sync.py</text>
    <text x="1294" y="438" fill="#8fa8c1" font-size="12">Python script</text>

    <!-- Dependencies and outputs. -->
    <rect x="1510" y="125" width="245" height="72" rx="11" fill="#10253a" stroke="#39708c" stroke-width="1.5"/>
    <circle cx="1532" cy="161" r="7" fill="#62d7cc"/>
    <text x="1550" y="157" fill="#e5f0fa" font-size="15" font-weight="650">LegacySIS</text>
    <text x="1550" y="178" fill="#8fa8c1" font-size="13">Student.Person · database</text>

    <rect x="1510" y="250" width="245" height="72" rx="11" fill="#10253a" stroke="#39708c" stroke-width="1.5"/>
    <circle cx="1532" cy="286" r="7" fill="#69baff"/>
    <text x="1550" y="282" fill="#e5f0fa" font-size="15" font-weight="650">students.csv</text>
    <text x="1550" y="303" fill="#8fa8c1" font-size="13">shared file · read / write</text>

    <rect x="1510" y="375" width="245" height="60" rx="11" fill="#10253a" stroke="#39708c" stroke-width="1.5"/>
    <circle cx="1532" cy="405" r="7" fill="#c099ff"/>
    <text x="1550" y="401" fill="#e5f0fa" font-size="15" font-weight="650">IdentityHub</text>
    <text x="1550" y="420" fill="#8fa8c1" font-size="12">REST API</text>

    <rect x="1510" y="470" width="245" height="60" rx="11" fill="#10253a" stroke="#39708c" stroke-width="1.5"/>
    <circle cx="1532" cy="500" r="7" fill="#f0b65d"/>
    <text x="1550" y="496" fill="#e5f0fa" font-size="15" font-weight="650">Partner SFTP</text>
    <text x="1550" y="515" fill="#8fa8c1" font-size="12">file delivery</text>
  </g>
</svg>
