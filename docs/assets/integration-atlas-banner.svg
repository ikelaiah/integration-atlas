<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title description">
  <title id="title">Integration Atlas</title>
  <desc id="description">A map of Windows and Linux scheduler jobs flowing through scripts to databases, files and APIs, beside the Integration Atlas name.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101f"/><stop offset="0.55" stop-color="#0a1630"/><stop offset="1" stop-color="#17132f"/>
    </linearGradient>
    <linearGradient id="atlas-mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#71d8ff"/><stop offset="1" stop-color="#4c8dff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#52c8ff"/><stop offset="1" stop-color="#55e0bb"/></linearGradient>
    <radialGradient id="blue-halo"><stop offset="0" stop-color="#1c73c7" stop-opacity=".22"/><stop offset="1" stop-color="#1c73c7" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet-halo"><stop offset="0" stop-color="#7448a7" stop-opacity=".17"/><stop offset="1" stop-color="#7448a7" stop-opacity="0"/></radialGradient>
    <pattern id="dot-grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#87b7e8" opacity=".18"/></pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1800" height="600" rx="30" fill="url(#background)"/><rect width="1800" height="600" rx="30" fill="url(#dot-grid)"/>
  <ellipse cx="1310" cy="280" rx="610" ry="430" fill="url(#blue-halo)"/><ellipse cx="1690" cy="135" rx="340" ry="280" fill="url(#violet-halo)"/>

  <g fill="none" stroke="#438bd2" stroke-width="2" opacity=".22"><path d="M720 72h86l28 28h42"/><path d="M720 528h106l32-32h36"/><path d="M1510 74h90l24 24h108"/><path d="M1550 525h88l26-26h72"/></g>
  <g fill="#68cfff" opacity=".65"><circle cx="720" cy="72" r="4"/><circle cx="876" cy="128" r="4"/><circle cx="720" cy="528" r="4"/><circle cx="894" cy="496" r="4"/></g>

  <!-- Compass mark built from connected system nodes. -->
  <g transform="translate(102 111)">
    <circle cx="42" cy="42" r="39" fill="#0e2543" stroke="#28547c" stroke-width="2"/>
    <path d="M23 56 35 34 62 25 51 51 23 56Z" fill="none" stroke="url(#atlas-mark)" stroke-width="3" stroke-linejoin="round"/><path d="m35 34 16 17" stroke="#78e5db" stroke-width="2" opacity=".9"/>
    <circle cx="23" cy="56" r="4" fill="#63d6ff"/><circle cx="35" cy="34" r="4" fill="#68e2d2"/><circle cx="62" cy="25" r="4" fill="#80a9ff"/><circle cx="51" cy="51" r="4" fill="#63d6ff"/>
  </g>
  <text x="202" y="148" fill="#d7e6f5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" letter-spacing="3.5">MAP THE SYSTEMS YOU INHERITED</text>
  <text x="100" y="264" fill="#f5f8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="720" letter-spacing="-2.4">Integration</text>
  <text x="100" y="352" fill="url(#accent)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="720" letter-spacing="-2.4">Atlas</text>
  <text x="103" y="414" fill="#bdcadd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Trace the jobs, scripts and systems.</text>
  <text x="103" y="449" fill="#bdcadd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">See what could break when something changes.</text>
  <g transform="translate(103 500)">
    <rect width="12" height="12" rx="3" y="1" fill="#55d4c0"/><text x="24" y="13" fill="#a9bed3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="1.4">LOCAL-FIRST</text>
    <rect x="160" y="1" width="12" height="12" rx="3" fill="#55d4c0"/><text x="184" y="13" fill="#a9bed3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="1.4">EVIDENCE-LED</text>
    <rect x="355" y="1" width="12" height="12" rx="3" fill="#55d4c0"/><text x="379" y="13" fill="#a9bed3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="1.4">IMPACT ANALYSIS</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="858" y="89" fill="#8ea8c2" font-size="14" font-weight="700" letter-spacing="2.6">FROM SCHEDULE TO IMPACT</text>
    <path d="M1087 190H1168M1087 410H1168M1335 190C1394 190 1384 286 1448 286M1335 410C1394 410 1384 314 1448 314" fill="none" stroke="#5d91c5" stroke-width="2.5" opacity=".7"/>
    <path d="M1574 286C1620 286 1605 178 1652 178M1574 300C1625 300 1606 286 1652 286M1574 314C1620 314 1605 394 1652 394" fill="none" stroke="#61c7c1" stroke-width="2.5" opacity=".72"/>
    <g fill="#79dfff" filter="url(#soft-glow)"><circle cx="1168" cy="190" r="4"/><circle cx="1168" cy="410" r="4"/><circle cx="1448" cy="286" r="4"/><circle cx="1448" cy="314" r="4"/></g>

    <rect x="858" y="145" width="229" height="90" rx="12" fill="#0c1b31" stroke="#35628b" stroke-width="1.5"/>
    <rect x="876" y="165" width="34" height="34" rx="8" fill="#102f4f"/><path d="M884 174h18v16h-18zM888 170v7M898 170v7M884 180h18" fill="none" stroke="#71ceff" stroke-width="1.7" stroke-linecap="round"/>
    <text x="923" y="178" fill="#e5f0fa" font-size="15" font-weight="650">Windows Scheduler</text><text x="923" y="202" fill="#8fa8c1" font-size="13">APP-SERVER-01 · task</text><circle cx="1066" cy="190" r="3" fill="#65d3ff"/>

    <rect x="858" y="365" width="229" height="90" rx="12" fill="#0c1b31" stroke="#35628b" stroke-width="1.5"/>
    <rect x="876" y="385" width="34" height="34" rx="8" fill="#12352f"/><path d="M884 391h18v22h-18zM887 396h12M887 401h12M887 406h8" fill="none" stroke="#70dfbd" stroke-width="1.7" stroke-linecap="round"/>
    <text x="923" y="398" fill="#e5f0fa" font-size="15" font-weight="650">Linux cron</text><text x="923" y="422" fill="#8fa8c1" font-size="13">APP-SERVER-02 · crontab</text><circle cx="1066" cy="410" r="3" fill="#70dfbd"/>

    <rect x="1168" y="150" width="167" height="80" rx="12" fill="#12233c" stroke="#4671a0" stroke-width="1.5"/><circle cx="1192" cy="175" r="8" fill="#4a9cff"/>
    <text x="1210" y="180" fill="#eaf3ff" font-size="15" font-weight="650">Nightly export</text><text x="1187" y="207" fill="#93abc4" font-size="13">job · runs on server</text>
    <rect x="1168" y="370" width="167" height="80" rx="12" fill="#12233c" stroke="#4671a0" stroke-width="1.5"/><circle cx="1192" cy="395" r="8" fill="#58d4b5"/>
    <text x="1210" y="400" fill="#eaf3ff" font-size="15" font-weight="650">Identity sync</text><text x="1187" y="427" fill="#93abc4" font-size="13">job · runs on server</text>

    <rect x="1448" y="250" width="126" height="100" rx="14" fill="#13253c" stroke="#4a8297" stroke-width="1.5"/>
    <path d="m1471 284-10 9 10 9M1501 284l10 9-10 9M1492 279l-11 28" fill="none" stroke="#70d9cb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="1462" y="328" fill="#e5f0fa" font-size="14" font-weight="650">Script</text>

    <rect x="1652" y="146" width="112" height="64" rx="11" fill="#10253a" stroke="#39708c" stroke-width="1.5"/><circle cx="1673" cy="178" r="8" fill="#62d7cc"/><text x="1690" y="183" fill="#e5f0fa" font-size="14" font-weight="650">Database</text>
    <rect x="1652" y="254" width="112" height="64" rx="11" fill="#10253a" stroke="#39708c" stroke-width="1.5"/><circle cx="1673" cy="286" r="8" fill="#69baff"/><text x="1690" y="291" fill="#e5f0fa" font-size="14" font-weight="650">File</text>
    <rect x="1652" y="362" width="112" height="64" rx="11" fill="#10253a" stroke="#39708c" stroke-width="1.5"/><circle cx="1673" cy="394" r="8" fill="#c099ff"/><text x="1690" y="399" fill="#e5f0fa" font-size="14" font-weight="650">API</text>
  </g>
</svg>
